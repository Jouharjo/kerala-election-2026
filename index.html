<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Monitor - Election Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10.1.1/dist/gridstack.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #0a0a0a;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            padding-bottom: 60px; 
        }

        .wm-header {
            border-bottom: 1px solid #27272a;
            background: #121212;
            height: 50px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .wm-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            letter-spacing: 2px;
            color: #fff;
        }

        .sticky-video-panel {
            position: sticky;
            top: 50px; 
            z-index: 90;
            background: #121212;
            border-bottom: 2px solid #ef4444; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            height: 38vh; 
            min-height: 250px;
            display: flex;
            flex-direction: column;
        }

        /* * CUSTOM SCROLL KNOB STYLES 
         */
        #custom-scroll-track {
            position: fixed;
            top: 55px; /* Just below header */
            right: 4px; /* Keeps it slightly off the edge to avoid Android swipe gestures */
            width: 32px;
            bottom: 10px;
            z-index: 9999;
            pointer-events: none; /* Let clicks pass through the track */
        }

        #custom-scroll-thumb {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 60px; /* Size of the drag button */
            background: rgba(239, 68, 68, 0.7); /* Translucent red */
            border: 1px solid #ef4444;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            pointer-events: auto; /* Catch touches */
            touch-action: none; /* Prevent native zooming/scrolling while dragging this */
            box-shadow: -2px 0 10px rgba(0,0,0,0.8);
            cursor: grab;
            transition: background 0.2s, transform 0.1s;
        }

        #custom-scroll-thumb:active, #custom-scroll-thumb.active-drag {
            background: rgba(239, 68, 68, 1);
            transform: scale(1.05);
            cursor: grabbing;
        }

        .grid-stack { padding: 16px 8px; min-height: calc(100vh - 60px); }

        .grid-stack-item-content {
            background: #121212;
            border: 1px solid #27272a;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 12px 16px; 
            border-bottom: 1px solid #27272a;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            letter-spacing: 1.5px;
            color: #a1a1aa;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #121212;
        }

        .grip-handle {
            cursor: grab;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            color: #52525b;
            transition: color 0.2s;
        }
        .grip-handle:hover { color: #a1a1aa; }
        .grip-handle:active { cursor: grabbing; color: #fff; }

        .wm-tabs-container {
            padding: 8px 12px;
            border-bottom: 1px solid #27272a;
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
            overflow-x: auto;
            background: #121212;
            -webkit-overflow-scrolling: touch;
            -ms-overflow-style: none;  
            scrollbar-width: none;     
        }
        .wm-tabs-container::-webkit-scrollbar { display: none; }

        .wm-tab {
            background: transparent;
            border: 1px solid #3f3f46;
            color: #a1a1aa;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .wm-tab:hover { border-color: #71717a; color: #fff; }
        .wm-tab.active-red { background: #ef4444; border-color: #ef4444; color: white; font-weight: bold; }
        .wm-tab.active-gray { background: #3f3f46; color: white; }

        .panel-content {
            flex: 1;
            position: relative;
            background: #000;
        }
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
            overscroll-behavior: contain; 
        }

        .grid-stack-item.ui-draggable-dragging .panel-content,
        .grid-stack-item.ui-resizable-resizing .panel-content { pointer-events: none; }
    </style>
</head>
<body>
    
    <header class="wm-header">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #a1a1aa;"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        <div class="wm-title">Election Monitor</div>
    </header>

    <div id="custom-scroll-track">
        <div id="custom-scroll-thumb">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <polyline points="19 12 12 19 5 12"></polyline>
                <polyline points="19 12 12 5 5 12"></polyline>
            </svg>
        </div>
    </div>

    <div class="sticky-video-panel">
        <div class="panel-header" style="cursor: default;">
            <div>LIVE NEWS <span style="color: #ef4444; font-size: 10px; margin-left: 8px;">● 93</span></div>
        </div>
        <div class="wm-tabs-container">
            <button class="wm-tab active-red" onclick="changeChannel(0)" id="ch-0">24 NEWS</button>
            <button class="wm-tab" onclick="changeChannel(1)" id="ch-1">REPORTER</button>
            <button class="wm-tab" onclick="changeChannel(2)" id="ch-2">MEDIAONE</button>
            <button class="wm-tab" onclick="changeChannel(3)" id="ch-3">MANORAMA</button>
            <button class="wm-tab" onclick="changeChannel(4)" id="ch-4">ASIANET</button>
            <button class="wm-tab" onclick="changeChannel(5)" id="ch-5">BIG TV</button>
        </div>
        <div class="panel-content">
            <iframe id="newsFrame" src="https://www.youtube.com/embed/1wECsnGZcfc?autoplay=1&mute=0" allowfullscreen></iframe>
        </div>
    </div>

    <div class="grid-stack">

        <div class="grid-stack-item" gs-w="12" gs-h="8" gs-x="0" gs-y="0">
            <div class="grid-stack-item-content">
                <div class="panel-header">
                    <div>REGIONAL DASHBOARD</div>
                    <div class="grip-handle">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>
                    </div>
                </div>
                <div class="wm-tabs-container" style="justify-content: center;">
                    <button class="wm-tab active-gray" onclick="toggleInsight(1)" id="btn-src1">SOURCE 1 (KERALA DESK)</button>
                    <button class="wm-tab" onclick="toggleInsight(2)" id="btn-src2">SOURCE 2 (VERCEL APP)</button>
                </div>
                <div class="panel-content">
                    <iframe id="insight1" src="https://www.keraladesk.com/election2026"></iframe>
                    <iframe id="insight2" src="https://kerala-assembly-elections.vercel.app/" style="display: none;"></iframe>
                </div>
            </div>
        </div>

        <div class="grid-stack-item" gs-w="12" gs-h="8" gs-x="0" gs-y="8">
            <div class="grid-stack-item-content">
                <div class="panel-header">
                    <div>NATIONAL OVERVIEW (NDTV)</div>
                    <div class="grip-handle">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>
                    </div>
                </div>
                <div class="panel-content">
                    <iframe src="https://www.ndtv.com/elections"></iframe>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.1.1/dist/gridstack-all.js"></script>
    
    <script>
        var grid = GridStack.init({
            handle: '.grip-handle',
            margin: 16, 
            cellHeight: 70
        });

        grid.on('dragstart', function(event, el) { document.querySelectorAll('.grid-stack-item iframe').forEach(frame => frame.style.pointerEvents = 'none'); });
        grid.on('dragstop', function(event, el) { document.querySelectorAll('.grid-stack-item iframe').forEach(frame => frame.style.pointerEvents = 'auto'); });

        const channels = [
            { id: '1wECsnGZcfc', btn: 'ch-0' },
            { id: 'nObUcHKZEGY', btn: 'ch-1' }, 
            { id: '-8d8-c0yvyU', btn: 'ch-2' }, 
            { id: '3miKzKlmA-4', btn: 'ch-3' }, 
            { id: 's0LLVQeMmtU', btn: 'ch-4' },
            { id: 'AT0fo8Ty4jo', btn: 'ch-5' }  
        ];

        function changeChannel(index) {
            const frame = document.getElementById('newsFrame');
            frame.src = `https://www.youtube.com/embed/${channels[index].id}?autoplay=1&mute=0`;
            
            document.querySelectorAll('#ch-0, #ch-1, #ch-2, #ch-3, #ch-4, #ch-5').forEach(btn => btn.classList.remove('active-red'));
            document.getElementById(channels[index].btn).classList.add('active-red');
        }

        function toggleInsight(source) {
            const iframe1 = document.getElementById('insight1');
            const iframe2 = document.getElementById('insight2');
            const btn1 = document.getElementById('btn-src1');
            const btn2 = document.getElementById('btn-src2');

            if (source === 1) {
                iframe1.style.display = 'block';
                iframe2.style.display = 'none';
                btn1.classList.add('active-gray');
                btn2.classList.remove('active-gray');
            } else {
                iframe1.style.display = 'none';
                iframe2.style.display = 'block';
                btn1.classList.remove('active-gray');
                btn2.classList.add('active-gray');
            }
        }

        /* * CUSTOM DRAG SCROLL LOGIC
         * Syncs the thumb position with the page, and the page with the thumb
         */
        const track = document.getElementById('custom-scroll-track');
        const thumb = document.getElementById('custom-scroll-thumb');
        let isDragging = false;

        function updateScrollFromEvent(yPos) {
            const trackRect = track.getBoundingClientRect();
            const thumbHeight = thumb.offsetHeight;
            
            // Calculate how far down the track we clicked/dragged
            let percent = (yPos - trackRect.top - (thumbHeight / 2)) / (trackRect.height - thumbHeight);
            percent = Math.max(0, Math.min(1, percent)); // Keep between 0 and 1
            
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            window.scrollTo(0, maxScroll * percent);
        }

        // Touch Events for Mobile
        thumb.addEventListener('touchstart', function(e) {
            isDragging = true;
            thumb.classList.add('active-drag');
            // Prevent iframes from stealing touch events while dragging
            document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = 'none');
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            e.preventDefault(); 
            updateScrollFromEvent(e.touches[0].clientY);
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            if (!isDragging) return;
            isDragging = false;
            thumb.classList.remove('active-drag');
            document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = 'auto');
        });

        // Mouse Events for Desktop Testing
        thumb.addEventListener('mousedown', function(e) {
            isDragging = true;
            thumb.classList.add('active-drag');
            document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = 'none');
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            e.preventDefault();
            updateScrollFromEvent(e.clientY);
        });

        document.addEventListener('mouseup', function(e) {
            if (!isDragging) return;
            isDragging = false;
            thumb.classList.remove('active-drag');
            document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = 'auto');
        });

        // Sync thumb visual position when user scrolls normally
        window.addEventListener('scroll', function() {
            if (isDragging) return;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            if (maxScroll <= 0) return;
            
            const percent = window.scrollY / maxScroll;
            const trackHeight = track.getBoundingClientRect().height;
            const maxThumbY = trackHeight - thumb.offsetHeight;
            
            thumb.style.top = (percent * maxThumbY) + 'px';
        });
    </script>
</body>
</html>
