<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerala Election 2026 - Live Monitor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }

        .panel {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .panel-header {
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .panel-header.eci {
            background: linear-gradient(135deg, #f97316 0%, #dc2626 100%);
        }

        .panel-header.news {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
        }

        .panel-header.keraladesk {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }

        .panel-header.alternative {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
        }

        .panel-content {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #f9fafb;
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }

        .grid-container {
            display: grid;
            gap: 12px;
            padding: 12px;
            height: calc(100vh - 80px);
        }

        /* Desktop Layout - 2x2 Grid */
        @media (min-width: 1024px) {
            .grid-container {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
            }
        }

        /* Tablet Layout - 2 columns, stacked */
        @media (min-width: 768px) and (max-width: 1023px) {
            .grid-container {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
                height: auto;
                min-height: calc(100vh - 80px);
            }
            .panel {
                min-height: 400px;
            }
        }

        /* Mobile Layout - Single column */
        @media (max-width: 767px) {
            .grid-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                height: auto;
            }
            .panel {
                min-height: 350px;
            }
        }

        .eci-fallback {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
        }

        .eci-fallback svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            color: #d97706;
        }

        .open-btn {
            margin-top: 16px;
            padding: 12px 24px;
            background: #f97316;
            color: white;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
        }

        .open-btn:hover {
            background: #ea580c;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(249, 115, 22, 0.4);
        }

        .refresh-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }

        .refresh-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .news-controls {
            padding: 8px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .news-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: #f3f4f6;
            color: #4b5563;
        }

        .news-btn.active {
            background: #dc2626;
            color: white;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
        }

        .news-btn:hover {
            background: #e5e7eb;
        }

        .news-btn.active:hover {
            background: #b91c1c;
        }

        .header {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            color: white;
            padding: 12px 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 100%;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @media (max-width: 640px) {
            .header h1 {
                font-size: 16px;
            }
        }

        .stats-badge {
            background: rgba(255,255,255,0.15);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Loading Animation */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: #f9fafb;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100">
    
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/>
                </svg>
                <span>Kerala Election 2026 - Live Monitor</span>
            </h1>
            <div class="stats-badge">
                <div class="live-dot"></div>
                <span>LIVE</span>
            </div>
        </div>
    </header>

    <!-- Main Grid -->
    <div class="grid-container">
        
        <!-- Panel 1: ECI Official (Top-Left) -->
        <div class="panel">
            <div class="panel-header eci">
                <div class="flex items-center gap-2">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                    ECI Official Results
                </div>
                <button class="refresh-btn" onclick="openECI()">Open →</button>
            </div>
            <div class="panel-content">
                <div class="eci-fallback">
                    <svg fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                    </svg>
                    <h3 style="font-weight: 600; color: #92400e; margin-bottom: 8px;">ECI restricts iframe embedding</h3>
                    <p style="font-size: 14px; color: #78350f; margin-bottom: 16px;">Click below to view official results in new tab</p>
                    <a href="https://results.eci.gov.in/" target="_blank" class="open-btn">
                        📊 Open ECI Official Results
                    </a>
                    <p style="font-size: 11px; color: #92400e; margin-top: 12px;">Auto-refreshes when available</p>
                </div>
            </div>
        </div>

        <!-- Panel 2: Kerala Desk (Top-Right) -->
        <div class="panel">
            <div class="panel-header keraladesk">
                <div class="flex items-center gap-2">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M2 5a2 2 0 012-2h7a2 2 0 012 2v4a2 2 0 01-2 2H9l-3 3v-3H4a2 2 0 01-2-2V5z"/>
                        <path d="M15 7v2a4 4 0 01-4 4H9.828l-1.766 1.767c.28.149.599.233.938.233h2l3 3v-3h2a2 2 0 002-2V9a2 2 0 00-2-2h-1z"/>
                    </svg>
                    Kerala Desk Analysis
                </div>
                <button class="refresh-btn" onclick="refreshFrame('keralaDesk')">↻</button>
            </div>
            <div class="panel-content" id="keralaDesk">
                <iframe src="https://www.keraladesk.com/election2026" title="Kerala Desk"></iframe>
            </div>
        </div>

        <!-- Panel 3: Alternative Source (Bottom-Left) -->
        <div class="panel">
            <div class="panel-header alternative">
                <div class="flex items-center gap-2">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
                    </svg>
                    Alternative Results View
                </div>
                <button class="refresh-btn" onclick="refreshFrame('alternative')">↻</button>
            </div>
            <div class="panel-content" id="alternative">
                <iframe src="https://kerala-assembly-elections.vercel.app/" title="Alternative View"></iframe>
            </div>
        </div>

        <!-- Panel 4: Live News (Bottom-Right) -->
        <div class="panel">
            <div class="panel-header news">
                <div class="flex items-center gap-2">
                    <div class="live-dot"></div>
                    Live Malayalam News
                </div>
                <button class="refresh-btn" onclick="refreshNews()">↻</button>
            </div>
            <div class="news-controls">
                <button class="news-btn active" onclick="changeChannel(0)" id="ch-0">Asianet</button>
                <button class="news-btn" onclick="changeChannel(1)" id="ch-1">Manorama</button>
                <button class="news-btn" onclick="changeChannel(2)" id="ch-2">Mathrubhumi</button>
                <button class="news-btn" onclick="changeChannel(3)" id="ch-3">MediaOne</button>
                <button class="news-btn" onclick="changeChannel(4)" id="ch-4">News18</button>
            </div>
            <div class="panel-content">
                <iframe 
                    id="newsFrame" 
                    src="https://www.youtube.com/embed/live_stream?channel=UCrdSJJHb1kuQWqYXXrhkCAA&autoplay=0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen
                    title="Live News">
                </iframe>
            </div>
        </div>

    </div>

    <script>
        // News Channels Configuration
        const channels = [
            { name: 'Asianet News', id: 'UCrdSJJHb1kuQWqYXXrhkCAA' },
            { name: 'Manorama News', id: 'UC17G-QBi-SLjHQ9dNIBZZmw' },
            { name: 'Mathrubhumi News', id: 'UCd3-59oqFvW4hDT-0bRj6YA' },
            { name: 'MediaOne', id: 'UCP-8BawpvqybG7O9kJcMJaw' },
            { name: 'News18 Kerala', id: 'UCDiwF2ebsW10IL765ndThmA' }
        ];

        // Change News Channel
        function changeChannel(index) {
            const frame = document.getElementById('newsFrame');
            frame.src = `https://www.youtube.com/embed/live_stream?channel=${channels[index].id}&autoplay=1`;
            
            // Update button styles
            document.querySelectorAll('.news-btn').forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Refresh specific iframe
        function refreshFrame(id) {
            const container = document.getElementById(id);
            const iframe = container.querySelector('iframe');
            iframe.src = iframe.src;
        }

        // Refresh news
        function refreshNews() {
            const iframe = document.getElementById('newsFrame');
            iframe.src = iframe.src;
        }

        // Open ECI in new tab
        function openECI() {
            window.open('https://results.eci.gov.in/', '_blank');
        }

        // Auto-refresh iframes every 3 minutes (except news)
        setInterval(() => {
            refreshFrame('keralaDesk');
            refreshFrame('alternative');
            console.log('Auto-refreshed at:', new Date().toLocaleTimeString());
        }, 180000); // 3 minutes

        // Attempt to load ECI via proxy (if available)
        function tryECIProxy() {
            const eciContainer = document.querySelector('.eci-fallback');
            // You can add a proxy service here if needed
            // For now, we show the fallback with open button
        }

        // Log when page loads
        console.log('Kerala Election Monitor 2026 - Multi-view Dashboard Active! 🎉');
        console.log('All 4 sources loading simultaneously...');
        
        // Try to check if ECI allows embedding (it won't, but we try)
        tryECIProxy();
    </script>

</body>
</html>
