<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerala Election 2026 - Live Monitor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10.1.1/dist/gridstack.min.css" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f3f4f6;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }

        /* Update Panel style for Gridstack */
        .grid-stack-item-content {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        /* Make the header the drag handle */
        .panel-header {
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            cursor: grab; /* Indicate draggable */
        }
        .panel-header:active {
            cursor: grabbing;
        }

        .panel-header.eci { background: linear-gradient(135deg, #f97316 0%, #dc2626 100%); }
        .panel-header.news { background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); }
        .panel-header.keraladesk { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }
        .panel-header.alternative { background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%); }
        .panel-header.social { background: linear-gradient(135deg, #10b981 0%, #047857 100%); }

        .panel-content {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #f9fafb;
            /* Prevent iframes from interfering with drag/resize */
            pointer-events: auto; 
        }
        /* When dragging, disable pointer events on iframes so the mouse doesn't get stuck in them */
        .grid-stack-item.ui-draggable-dragging .panel-content,
        .grid-stack-item.ui-resizable-resizing .panel-content {
            pointer-events: none;
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Gridstack Container Styling */
        .grid-stack {
            padding: 12px;
            min-height: calc(100vh - 80px); /* Ensure space below header */
        }

        .eci-fallback {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
        }

        .eci-fallback svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            color: #d97706;
        }

        .open-btn {
            margin-top: 16px;
            padding: 12px 24px;
            background: #f97316;
            color: white;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
        }

        .open-btn:hover {
            background: #ea580c;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(249, 115, 22, 0.4);
        }

        .refresh-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
            z-index: 10; /* Ensure button is clickable above drag handle */
            position: relative;
        }

        .refresh-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .news-controls {
            padding: 8px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .news-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: #f3f4f6;
            color: #4b5563;
        }

        .news-btn.active {
            background: #dc2626;
            color: white;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
        }

        .header {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            color: white;
            padding: 12px 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 100%;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-badge {
            background: rgba(255,255,255,0.15);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    
    <header class="header">
        <div class="header-content">
            <h1>
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/>
                </svg>
                <span>Kerala Election 2026 - Live Monitor</span>
            </h1>
            <div class="stats-badge">
       div         <div class="live-dot"></div>
                <span>LIVE</span>
            </div>
        </div>
    </header>

       <div class="grid-stack">
        
        <div class="grid-stack-item" gs-w="12" gs-h="7" gs-x="0" gs-y="0">
            <div class="grid-stack-item-content">
                <div class="panel-header news drag-handle">
                    <div class="flex items-center gap-2">
                        <div class="live-dot"></div>
                        Live Malayalam News
                    </div>
                    <button class="refresh-btn" onclick="refreshNews()">↻</button>
                </div>
                <div class="news-controls">
                    <button class="news-btn active" onclick="changeChannel(0)" id="ch-0">Asianet</button>
                    <button class="news-btn" onclick="changeChannel(1)" id="ch-1">Manorama</button>
                    <button class="news-btn" onclick="changeChannel(2)" id="ch-2">Mathrubhumi</button>
                    <button class="news-btn" onclick="changeChannel(3)" id="ch-3">MediaOne</button>
                    <button class="news-btn" onclick="changeChannel(4)" id="ch-4">News18</button>
                </div>
                <div class="panel-content">
                    <iframe 
                        id="newsFrame" 
                        src="https://www.youtube.com/embed/live_stream?channel=UCrdSJJHb1kuQWqYXXrhkCAA&autoplay=0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen
                        title="Live News">
                    </iframe>
                </div>
            </div>
        </div>

        <div class="grid-stack-item" gs-w="6" gs-h="6" gs-x="0" gs-y="7">
            <div class="grid-stack-item-content">
                <div class="panel-header keraladesk drag-handle">
                    <div class="flex items-center gap-2">
                        Kerala Desk Analysis
                    </div>
                    <button class="refresh-btn" onclick="refreshFrame('keralaDesk')">↻</button>
                </div>
                <div class="panel-content" id="keralaDesk">
                    <iframe src="https://www.keraladesk.com/election2026" title="Kerala Desk"></iframe>
                </div>
            </div>
        </div>

        <div class="grid-stack-item" gs-w="6" gs-h="6" gs-x="6" gs-y="7">
            <div class="grid-stack-item-content">
                <div class="panel-header alternative drag-handle">
                    <div class="flex items-center gap-2">
                        Alternative Results View
                    </div>
                    <button class="refresh-btn" onclick="refreshFrame('alternative')">↻</button>
                </div>
                <div class="panel-content" id="alternative">
                    <iframe src="https://kerala-assembly-elections.vercel.app/" title="Alternative View"></iframe>
                </div>
            </div>
        </div>

        <div class="grid-stack-item" gs-w="6" gs-h="6" gs-x="0" gs-y="13">
            <div class="grid-stack-item-content">
                <div class="panel-header social drag-handle">
                    <div class="flex items-center gap-2">
                        #KeralaElection2026 Feed
                    </div>
                </div>
                <div class="panel-content" style="padding: 10px; background: white; overflow-y: auto;">
                    <a class="twitter-timeline" href="https://twitter.com/search?q=%23KeralaElections2026" data-chrome="noheader nofooter noborders transparent" data-tweet-limit="5">Tweets about Kerala Elections</a> 
                    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
                </div>
            </div>
        </div>

        <div class="grid-stack-item" gs-w="6" gs-h="6" gs-x="6" gs-y="13">
            <div class="grid-stack-item-content">
                <div class="panel-header eci drag-handle">
                    <div class="flex items-center gap-2">
                        ECI Official Results
                    </div>
                    <button class="refresh-btn" onclick="openECI()">Open →</button>
                </div>
                <div class="panel-content">
                    <div class="eci-fallback">
                        <svg fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                        </svg>
                        <h3 style="font-weight: 600; color: #92400e; margin-bottom: 8px;">ECI restricts iframe embedding</h3>
                        <p style="font-size: 14px; color: #78350f; margin-bottom: 16px;">Click below to view official results</p>
                        <a href="https://results.eci.gov.in/" target="_blank" class="open-btn">
                            📊 Open ECI Results
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.1.1/dist/gridstack-all.js"></script>
    <script>
        // Initialize Gridstack with handle
        var grid = GridStack.init({
            handle: '.drag-handle',
            margin: 12,
            cellHeight: 70
        });

        // Fix for iFrame issue: Gridstack provides an event to add an overlay when dragging starts
        grid.on('dragstart', function(event, el) {
            var iframes = document.querySelectorAll('iframe');
            iframes.forEach(function(iframe) {
                iframe.style.pointerEvents = 'none';
            });
        });

        grid.on('dragstop', function(event, el) {
            var iframes = document.querySelectorAll('iframe');
            iframes.forEach(function(iframe) {
                iframe.style.pointerEvents = 'auto';
            });
        });

        // Your existing JS functions...
        const channels = [
            { name: 'Asianet News', id: 'UCrdSJJHb1kuQWqYXXrhkCAA' },
            { name: 'Manorama News', id: 'UC17G-QBi-SLjHQ9dNIBZZmw' },
            { name: 'Mathrubhumi News', id: 'UCd3-59oqFvW4hDT-0bRj6YA' },
            { name: 'MediaOne', id: 'UCP-8BawpvqybG7O9kJcMJaw' },
            { name: 'News18 Kerala', id: 'UCDiwF2ebsW10IL765ndThmA' }
        ];

        function changeChannel(index) {
            const frame = document.getElementById('newsFrame');
            frame.src = `https://www.youtube.com/embed/live_stream?channel=${channels[index].id}&autoplay=1`;
            document.querySelectorAll('.news-btn').forEach((btn, i) => {
                if (i === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        function refreshFrame(id) {
            const container = document.getElementById(id);
            const iframe = container.querySelector('iframe');
            iframe.src = iframe.src;
        }

        function refreshNews() {
            const iframe = document.getElementById('newsFrame');
            iframe.src = iframe.src;
        }

        function openECI() {
            window.open('https://results.eci.gov.in/', '_blank');
        }
    </script>
</body>
</html>
